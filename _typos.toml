# typos: spell-check code and docs (run by scripts/check.sh and CI).
[default.extend-words]
migate = "migate"   # the project's name, not a misspelling of "migrate"
# Deliberate misspellings in crates/migate-core/src/schema.rs tests, proving a reader's typo is refused.
defualt = "defualt"
predicat = "predicat"
tabel = "tabel"
doub = "doub"   # SQLite's type-affinity rule: a declared type containing "DOUB" is REAL

[files]
extend-exclude = [
  "docs/transcript.md",        # a recorded conversation: quoted text stays as it was
  "docs/research/bench/**",    # recorded data and third-party output
  "Cargo.lock",
]
