name: mutants
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is in the comment), so an upstream change cannot alter CI.
jobs:
  mutants:
    name: mutation testing (migate-core)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.93.1" # keep equal to rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants
      - name: just mutants migate-core
        run: |
          status=0
          bash scripts/mutants.sh migate-core > mutants.txt 2>&1 || status=$?
          cat mutants.txt
          { echo '```'; grep -E '^mutants|missed:' mutants.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 2 (missed mutants) and 3 (timeouts) are findings to read in the summary; any other failure is a broken run.
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out-dir/mutants.out
