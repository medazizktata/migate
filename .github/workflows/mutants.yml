name: mutants
on:
  workflow_call:
    inputs:
      runner:
        description: The runs-on labels as JSON; GitHub's hosted runner unless the fallback (fallback.yml) asks otherwise.
        type: string
        default: '"ubuntu-latest"'
      ref:
        description: The commit to check; the triggering one when empty.
        type: string
        default: ""
  schedule:
    - cron: "17 3 1 * *" # the 1st of each month, 03:17 UTC (runner minutes: docs/releasing.md)
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is in the comment), so an upstream change cannot alter CI.
jobs:
  mutants:
    name: mutation testing (${{ matrix.name }})
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }} # GitHub's, or the fallback's (docs/ci-runner.md)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: migate-core
            crate: migate-core
            args: ""
          # The SQL scanner behind target_version: mutation testing found most of today's gaps there; its own tests
          # catch its mutants, so this is minutes, not hours.
          - name: SQL scanner
            crate: migate-engine-sqlite
            args: "--file crates/engine/sqlite/src/features.rs"
    env:
      CRATE: ${{ matrix.crate }}
      ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/runner-prep
        with:
          target-dir: "false" # cargo-mutants builds each mutant in its own copy
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.93.1" # keep equal to rust-toolchain.toml
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants
      - name: just mutants on this target
        run: |
          status=0
          read -ra extra <<< "$ARGS"
          bash scripts/mutants.sh "$CRATE" "${extra[@]}" > mutants.txt 2>&1 || status=$?
          cat mutants.txt
          { echo '```'; grep -E '^mutants|missed:' mutants.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 2 (missed mutants) and 3 (timeouts) are findings to read in the summary; any other failure is a broken run.
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out-${{ matrix.crate }}
          path: mutants.out-dir/mutants.out
          retention-days: 30 # kept on GitHub, where storage is billed
