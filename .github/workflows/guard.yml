name: guard
# On every push: nothing sensitive leaves the machine, about one runner minute. The full suite is ci.yml.
on:
  workflow_call:
    inputs:
      runner:
        description: The runs-on labels as JSON; GitHub's hosted runner unless the fallback (fallback.yml) asks otherwise.
        type: string
        default: '"ubuntu-latest"'
      ref:
        description: The commit to check; the triggering one when empty.
        type: string
        default: ""
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is in the comment), so an upstream change cannot alter CI.
jobs:
  sensitive:
    # The owner's private names are checked locally (.git/info/sensitive-patterns); CI checks the generic rules, so a
    # push made with --no-verify is still caught.
    name: nothing sensitive in the history
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }} # GitHub's, or the fallback's (docs/ci-runner.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/runner-prep
      - name: install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/bin" gitleaks
      - run: bash scripts/check-sensitive.sh all
