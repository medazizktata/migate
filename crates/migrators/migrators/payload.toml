id = "payload"
name = "Payload"
# Files: <migrations dir>/YYYYMMDD_HHMMSS_<name>.ts (index.ts is not a migration). The history table stores the stem.
# The folder must be named migrations (Payload's default, src/migrations): seed scripts use the same file names.
path_pattern = '(?:^|/)migrations/(?P<id>(?P<version>\d{8}_\d{6})_[^/]+?)\.ts$'
order = "timestamp-prefix"
# Payload runs any file not in payload_migrations, in any order (docs/research/first-pass.md).
out_of_order = "warn"
# payload_migrations stores the whole name, so two files with one timestamp both apply.
duplicate_versions = "warn"
checksum = "none"

[history]
kind = "full"
# batch -1 marks a dev push, not a migration (packages/payload/src/database/migrations/migrationsCollection.ts).
query = "SELECT name FROM payload_migrations WHERE batch <> -1"

[migrate]
command = "npx --no payload migrate"
# Stock `payload migrate` refuses to start without a secret (docs/research/spike-7.md); any value works in a sandbox.
env = { PAYLOAD_SECRET = "migate-sandbox-secret" }

[references]
# A collection or global field: Payload names the column after the field (camelCase becomes snake_case).
files = ["**/collections/**/*.{ts,tsx,js}", "**/globals/**/*.{ts,tsx,js}", "**/payload.config.{ts,js}"]
patterns = ['''name:\s*["']{field}["']''', '''name:\s*["']{column}["']''']
