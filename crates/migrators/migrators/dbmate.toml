id = "dbmate"
name = "dbmate"
# Files: <migrations dir>/<version>_<name>.sql, each with a `-- migrate:up` and a `-- migrate:down` section; the
# history table (schema_migrations, or the project's --migrations-table, set with history_query in migate.toml) stores
# the version.
path_pattern = '(?:^|/)migrations/(?P<id>(?P<version>\d+)_[^/]+)\.sql$'
order = "timestamp-prefix"
# `dbmate up` applies every pending migration, an older one included, unless run with --strict.
out_of_order = "warn"
checksum = "none"

[history]
kind = "full"
query = "SELECT version FROM schema_migrations"

[migrate]
command = 'dbmate --url "{url}?sslmode=disable" up'
env = {}

[references]
# Raw SQL in the app's code: the column's name with its table's name within 3 lines (a query, a query builder call).
# Tests, vendored and minified code, and .sql files (schema dumps, probes; migrations never count) are not the code
# serving traffic. The weakest rule: SQL built at run time, or a name shared with another table, can mislead it.
files = ["**/*.{ts,tsx,js,mjs,cjs,py,rb,go,rs,php,java,kt,cs}"]
exclude = ["**/__tests__/**", "**/test/**", "**/tests/**", "**/spec/**", "**/*.{test,spec}.*", "**/*_test.*", "**/vendor/**", "**/*.min.js"]
patterns = ['\b{column}\b']
table_within = 3
