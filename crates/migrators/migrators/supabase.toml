id = "supabase"
name = "Supabase CLI migrations"
# Files: supabase/migrations/<14-digit version>_<name>.sql; supabase_migrations.schema_migrations stores the version.
path_pattern = '(?:^|/)supabase/migrations/(?P<id>(?P<version>\d{14})_[^/]+)\.sql$'
order = "timestamp-prefix"
# `supabase migration up` applies a pending migration older than the last one applied only with --include-all
# ("Include all migrations not found on remote history table", CLI 2.121 help); a project whose release uses that
# flag can set out_of_order = "warn" in migate.toml.
out_of_order = "block"
# The history table keeps each migration's statements, but `migration up` does not compare them with the files.
checksum = "none"

[history]
kind = "full"
query = "SELECT version FROM supabase_migrations.schema_migrations"

[migrate]
# Applies to any PostgreSQL by URL, no Docker; run where the supabase/ folder is (a monorepo sets `migrate` itself).
command = 'supabase migration up --include-all --db-url "{url}?sslmode=disable"'
env = {}

[references]
# Raw SQL in the app's code: the column's name with its table's name within 3 lines (a query, a query builder call).
# Tests, vendored and minified code, and .sql files (schema dumps, probes; migrations never count) are not the code
# serving traffic. The weakest rule: SQL built at run time, or a name shared with another table, can mislead it.
files = ["**/*.{ts,tsx,js,mjs,cjs,py,rb,go,rs,php,java,kt,cs}"]
exclude = ["**/__tests__/**", "**/test/**", "**/tests/**", "**/spec/**", "**/*.{test,spec}.*", "**/*_test.*", "**/vendor/**", "**/*.min.js"]
patterns = ['\b{column}\b']
table_within = 3
