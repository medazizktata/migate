id = "wrangler-d1"
name = "Wrangler D1 migrations"
# Files: migrations/NNNN_<name>.sql; d1_migrations.name stores the whole file name.
path_pattern = '(?:^|/)migrations/(?P<id>(?P<version>\d+)_[^/]+\.sql)$'
order = "numeric"
# Wrangler applies any file not in d1_migrations, in any order (workers-sdk src/d1/migrations/helpers.ts).
out_of_order = "warn"
# d1_migrations stores the whole file name, so 0004_a.sql and 0004_b.sql both apply, in name order.
duplicate_versions = "warn"
checksum = "none"

[history]
kind = "full"
query = "SELECT name FROM d1_migrations"

[migrate]
# {database} is the database's name or binding in the project's wrangler configuration ([sandbox] database_name).
# --persist-to puts local state in the run's folder, where Wrangler names the file after a hash of the database id;
# a metadata.sqlite sits next to it, so the file holding d1_migrations is the one read.
command = "npx --no wrangler d1 migrations apply {database} --local --persist-to {dir}"
env = {}
database = "{dir}/v3/d1/miniflare-D1DatabaseObject/*.sqlite"

[references]
# Raw SQL in the app's code: the column's name in a file that also names its table (migrations excluded). The weakest
# rule: a query built at run time, or a name shared with another table, can mislead it either way.
files = ["**/*.{ts,tsx,js,mjs,cjs,py,rb,go,rs,sql,php,java,kt,cs}"]
patterns = ['\b{column}\b']
with_table = true
