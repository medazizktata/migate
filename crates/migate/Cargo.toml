[package]
name = "migate"
description = "A release gate for database migrations, for any migrator, database and host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
migate-core = { path = "../migate-core" }
migate-migrators = { path = "../migate-migrators" }
migate-engine-sqlite = { path = "../migate-engine-sqlite" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Catch SIGINT/SIGTERM to remove the sandbox run's worktrees (the workspace forbids the unsafe a raw handler needs).
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[lints]
workspace = true
