[workspace]
resolver = "3"
members = ["crates/migate-core", "crates/migate-migrators", "crates/migate"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# CI runs clippy with -D warnings, so these are errors there. Tests may unwrap (clippy.toml).
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
