[workspace]
resolver = "3"
members = ["crates/core", "crates/migrators", "crates/engine/sqlite", "crates/engine/postgres", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# CI runs clippy with -D warnings, so these are errors there. Tests may unwrap (clippy.toml).
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
